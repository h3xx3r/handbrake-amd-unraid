services:
  handbrake-amd:
    image: ghcr.io/h3xx3r/handbrake-amd-unraid:latest
    build:
      context: .
      args:
        HANDBRAKE_REF: "${HANDBRAKE_REF:-master}"
    container_name: handbrake-amd
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "${WEB_PORT:-5800}:5800"
      - "${VNC_PORT:-5900}:5900"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      LANG: "${LANG:-de_DE.UTF-8}"
      USER_ID: "${USER_ID:-99}"
      GROUP_ID: "${GROUP_ID:-100}"
      UMASK: "${UMASK:-0022}"
      LIBVA_DRIVER_NAME: "${LIBVA_DRIVER_NAME:-radeonsi}"
      VAAPI_DEVICE: "${VAAPI_DEVICE:-/dev/dri/renderD128}"
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      DISPLAY_WIDTH: "${DISPLAY_WIDTH:-1920}"
      DISPLAY_HEIGHT: "${DISPLAY_HEIGHT:-1080}"
      KEEP_APP_RUNNING: "1"
    volumes:
      - "${CONFIG_PATH:-/mnt/user/appdata/handbrake-amd}:/config"
      - "${STORAGE_PATH:-/mnt/user}:/storage"
      - "${OUTPUT_PATH:-/mnt/user/Media/HandBrake}:/output"
      - "${WATCH_PATH:-/mnt/user/Media/HandBrake/watch}:/watch"
